# Rename this file to 'docker-compose.yml' before using.
# This file provides a template for spinning up the PostgreSQL database locally.
# You can override the environment variables by creating a '.env' file in this directory.

services:
  db:
    image: postgres:16
    container_name: fileguard-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abcdefghijklmnopqrstuvwxyz}
      POSTGRES_DB: ${POSTGRES_DB:-fileguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: